rgbd_odometry:
  ros__parameters:
    use_sim_time: true
    frame_id: camera_link
    odom_frame_id: odom
    approx_sync: true
    wait_for_transform: 0.2
    qos: 1
    qos_image: 1
    Odom/Strategy: "0"
    Vis/MinInliers: "8"
    Vis/FeatureType: "6"
    Vis/CorFlowMaxLevel: "3"
    Reg/Strategy: "1"
    Icp/VoxelSize: "0.05"
    Icp/PointToPlane: "true"
    Icp/MaxCorrespondenceDistance: "0.20"
    Icp/CorrespondenceRatio: "0.25"
    Odom/ResetCountdown: "10"
    Odom/MaxFeatures: "0"

rtabmap:
  ros__parameters:
    use_sim_time: true
    frame_id: camera_link
    approx_sync: true
    queue_size: 30
    qos: 1
    qos_image: 1
    qos_imu: 1
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_odom_info: false
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    Mem/STMSize: "30"
    Rtabmap/DetectionRate: "1"
    Mem/RehearsalSimilarity: "0.30"
    Kp/MaxFeatures: "500"
    Kp/DetectorStrategy: "6"
    Vis/MinInliers: "8"
    Vis/InlierDistance: "0.10"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityMaxGraphDepth: "30"
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/AngularUpdate: "0.03"
    RGBD/LinearUpdate: "0.03"
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/OptimizeMaxError: "3.0"
    Optimizer/Strategy: "0"
    Optimizer/Iterations: "100"
    Reg/Strategy: "1"
    Reg/Force3DoF: "false"
    Icp/VoxelSize: "0.05"
    Icp/MaxCorrespondenceDistance: "0.25"
    Icp/CorrespondenceRatio: "0.20"
    Icp/Iterations: "40"
    Icp/PointToPlane: "true"
    Grid/RangeMax: "5.0"
    Grid/RangeMin: "0.3"
    Grid/CellSize: "0.05"
    Grid/3D: "true"
    Grid/FromDepth: "true"
    Rtabmap/TimeThr: "0"
    Rtabmap/MemoryThr: "0"
    Mem/BadSignaturesIgnored: "false"
    Mem/RehearsalIdUpdatedToNewOne: "true"
    Odom/GuessMotion: "true"
    Odom/FilteringStrategy: "1"
